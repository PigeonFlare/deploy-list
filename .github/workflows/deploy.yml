name: Scrape and deploy

on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "LICENSE"]
  schedule:
    - cron: "17 6 * * *" # daily due-check; collect Reddit posts every 3 days
  workflow_dispatch:

# Nothing by default; each job asks only for what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # commit refreshed data on scheduled runs
    steps:
      # Actions are pinned to commit SHAs so a moved tag can't change what runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Keep the write token out of .git/config so only the commit step can push.
          persist-credentials: false
      - name: Test scraper and Reddit ingestion
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - name: Scrape Reddit top posts when due
        id: scrape
        if: github.event_name != 'push'
        # If scraping fails, the last committed data is deployed instead.
        continue-on-error: true
        timeout-minutes: 15
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REFRESH_TRIGGER: ${{ github.event_name }}
        run: |
          if [ "$REFRESH_TRIGGER" = "workflow_dispatch" ]; then
            python3 -B scripts/scrape.py
          else
            python3 -B scripts/scrape.py --if-due
          fi
      # Small stills of each ranked site for the homepage. Runs without the push token,
      # in the runner's own Chrome; stills are kept until their site leaves the rankings.
      - name: Capture site snapshots
        if: steps.scrape.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright-core@1.63.0
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/snapshots.cjs
      - name: Report retained rankings
        if: steps.scrape.outcome == 'failure'
        run: echo "::warning::Direct Reddit ingestion failed. Retaining the last successful rankings and update timestamp."
      - name: Commit refreshed data
        if: steps.scrape.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/sites.json data/reddit-cache.json site/snapshots
          git diff --cached --quiet || (git commit -m "Refresh rankings data" && git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main)
      # GitHub Pages lets browsers cache files for 10 minutes; tagging the stylesheet and
      # scripts with the commit makes each deploy show up on the next page load.
      - name: Version asset links
        env:
          VERSION: ${{ github.sha }}
        run: |
          find site -name '*.html' -exec sed -i -E "s#(assets/[a-z]+\.(css|js))\"#\1?v=${VERSION:0:8}\"#g" {} +
          grep -rho 'assets/[a-z]*\.[a-z]*?v=[0-9a-f]*' site --include='*.html' | sort | uniq -c
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
