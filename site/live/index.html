<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-src https:; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#f4f5f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0d14" media="(prefers-color-scheme: dark)">
  <title>Live · deploylist</title>
  <meta name="description" content="Stumble through this month's most-upvoted small websites.">
  <link rel="canonical" href="https://deploylist.com/live/">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="../assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body data-page="live" data-root="../" class="live">
  <div class="frame-wrap">
    <iframe id="frame" title="Current site" referrerpolicy="no-referrer"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-pointer-lock allow-modals"
      allow="fullscreen; clipboard-write; autoplay; gamepad"></iframe>
    <div class="empty" id="empty" hidden></div>
  </div>
  <div class="live-controls">
    <button class="lg round" id="prev" aria-label="Previous site" disabled><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
    <div class="lg now-playing" id="now">
      <a class="site" id="site-link" target="_blank" rel="noopener noreferrer">Loading…</a>
      <div class="meta"><span id="votes"></span><span class="sep" id="meta-sep" aria-hidden="true">·</span><a id="post-link" target="_blank" rel="noopener noreferrer">forum post</a></div>
    </div>
    <button class="lg round" id="next" aria-label="Next site"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>
  <script src="../assets/app.js" defer></script>
  <script src="../assets/live.js" defer></script>
</body>
</html>
