<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>deploylist</title>
  <meta name="description" content="The best snapshot of online development: this month's most-upvoted small websites.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="home" data-root="" class="home">
  <main class="hero">
    <h1 class="logo">deploylist</h1>
    <p class="tagline">The best snapshot of online development.</p>
    <div class="cta">
      <a class="glass pill" id="go-rankings" href="leaderboards/">Rankings</a>
      <a class="glass pill" id="go-live" href="live/">Live view</a>
    </div>
  </main>
  <script src="assets/app.js"></script>
  <script>
    DL.loadData().then((d) => DL.setCounts(d.sites, 25)).catch(() => {});
    // Carry the chosen category into the next page.
    function syncLinks() {
      const q = DL.category === "all" ? "" : "?cat=" + DL.category;
      document.getElementById("go-rankings").href = "leaderboards/" + q;
      document.getElementById("go-live").href = "live/" + q;
    }
    DL.onCategory(syncLinks); syncLinks();
  </script>
</body>
</html>
