<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rankings · deploylist</title>
  <meta name="description" content="The top 25 most-upvoted small websites of the month.">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body data-page="rankings" data-root="../" class="board-page">
  <main class="board">
    <h1>Top-voted <span class="noun"><span id="noun">projects</span><svg class="brush" viewBox="0 0 300 30" preserveAspectRatio="none" aria-hidden="true">
      <defs><clipPath id="brush-reveal"><rect class="brush-reveal" x="0" y="0" width="300" height="30"/></clipPath></defs>
      <g clip-path="url(#brush-reveal)">
        <path d="M4 17 C40 10 95 9 150 10 C205 11 255 9 296 12 C299 14 297 18 293 19 C250 17 200 19 150 20 C100 21 48 22 9 25 C3 25 1 20 4 17 Z"/>
        <path d="M20 13 C80 9 170 8 280 11 L280 12.4 C170 10 80 11 20 14.6 Z" opacity=".55"/>
        <path d="M14 22 C70 19 160 18 260 18 L262 19.6 C160 19.6 70 21 14 23.6 Z" opacity=".5"/>
        <path d="M60 16 C120 14 200 14 288 15 L288 15.8 C200 15.4 120 15.8 60 17 Z" fill-opacity=".35"/>
      </g>
    </svg></span></h1>
    <p class="sub">The most-upvoted standalone websites from Show HN and Reddit over the last 30 days.</p>
    <table class="ranks">
      <thead>
        <tr>
          <th class="rank">Rank</th>
          <th>Domain</th>
          <th class="num votes">Votes</th>
          <th class="src src-head">
            <button id="src-btn" aria-haspopup="true">Source</button>
            <div class="glass popover" id="src-pop"><p>Where posts are collected from</p><div id="src-list"></div></div>
          </th>
        </tr>
      </thead>
      <tbody id="rows"><tr><td colspan="4" class="updated">Loading…</td></tr></tbody>
    </table>
    <p class="updated" id="updated"></p>
  </main>
  <footer class="site-foot">
    <span>© 2026 deploylist.com</span>
    <a href="https://buymeacoffee.com/0wtynrfutb" target="_blank" rel="noopener">Donate</a>
  </footer>
  <script src="../assets/app.js"></script>
  <script>
    const { esc } = DL;
    const fmt = new Intl.NumberFormat("en-US");
    let data;

    function render() {
      const cat = DL.CATS.find((c) => c.key === DL.category);
      const noun = document.getElementById("noun");
      if (noun.textContent !== cat.noun) {
        noun.textContent = cat.noun;
        // Repaint the brush stroke under the new word.
        const r = document.querySelector(".brush-reveal");
        r.style.animation = "none"; r.getBoundingClientRect(); r.style.animation = "";
      }
      const rows = data.sites.filter((s) => DL.inCategory(s)).slice(0, 25);
      const max = rows[0]?.votes || 1;
      document.getElementById("rows").innerHTML = rows.length ? rows.map((s, i) => `
        <tr>
          <td class="rank"><span class="badge ${i < 3 ? "medal r" + (i + 1) : ""}">${i + 1}</span></td>
          <td class="domain-cell">
            <div class="bar" style="width:${(s.votes / max) * 100}%"></div>
            <div class="inner">
              <span><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.domain)} ↗</a>${s.embeddable ? "" : '<span class="nolive" title="This site can\'t be shown inside Live view">not in live</span>'}</span>
              <span class="title">${esc(s.title)}</span>
            </div>
          </td>
          <td class="num votes">${fmt.format(s.votes)}</td>
          <td class="src"><a href="${esc(s.post_url)}" target="_blank" rel="noopener">${esc(s.source)} ↗</a></td>
        </tr>`).join("") : `<tr><td colspan="4" class="updated">Nothing in this category yet.</td></tr>`;
    }

    const pop = document.getElementById("src-pop");
    document.getElementById("src-btn").addEventListener("click", (e) => {
      e.stopPropagation();
      const open = !pop.classList.contains("open");
      document.querySelectorAll(".dropdown.open").forEach((d) => d.classList.remove("open"));
      pop.classList.toggle("open", open);
    });
    pop.addEventListener("click", (e) => e.stopPropagation());

    DL.loadData().then((d) => {
      data = d;
      DL.setCounts(d.sites, 25);
      document.getElementById("src-list").innerHTML = d.sources.map((s) =>
        `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)} ↗</a>`).join("");
      document.getElementById("updated").textContent = "Updated " + new Date(d.generated_at).toLocaleString();
      render();
      DL.onCategory(render);
    }).catch(() => {
      document.getElementById("rows").innerHTML = '<tr><td colspan="4" class="updated">Couldn\'t load rankings.</td></tr>';
    });
  </script>
</body>
</html>
