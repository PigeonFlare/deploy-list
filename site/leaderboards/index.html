<body data-page="rankings" data-root="../" class="board-page">
  <main class="board">
    <h1>Top-voted <span class="noun"><span id="noun">projects</span><svg class="brush" viewBox="0 0 300 30" preserveAspectRatio="none" aria-hidden="true">
      <defs><clipPath id="brush-reveal"><rect class="brush-reveal" x="0" y="0" width="300" height="30"/></clipPath></defs>
      <g clip-path="url(#brush-reveal)">
        <path d="M4 17 C40 10 95 9 150 10 C205 11 255 9 296 12 C299 14 297 18 293 19 C250 17 200 19 150 20 C100 21 48 22 9 25 C3 25 1 20 4 17 Z"/>

        <path d="M14 22 C70 19 160 18 260 18 L262 19.6 C160 19.6 70 21 14 23.6 Z" opacity=".5"/>
        <path d="M60 16 C120 14 200 14 288 15 L288 15.8 C200 15.4 120 15.8 60 17 Z" fill-opacity=".35"/>

    </svg></span></h1>
    <p class="sub">The most-upvoted standalone websites from Show HN and Reddit over the last 30 days.</p>
    <table class="ranks">
      <thead>
        <tr>
          <th class="rank">Rank</th>
          <th>Domain</th>
          <th class="num votes">Votes</th>
          <th class="src src-head">
            <button id="src-btn" aria-haspopup="true">Source</button>
            <div class="glass popover" id="src-pop"><p>Where posts are collected from</p><div id="src-list"></div></div>
          </th>
        </tr>
      </thead>
      <tbody id="rows"><tr><td colspan="4" class="updated">Loading…</td></tr></tbody>
    </table>
    <p class="updated" id="updated"></p>
  </main>
  <footer class="site-foot">

  <script src="../assets/app.js" defer></script>
  <script src="../assets/rankings.js" defer></script>

</html>
